name: Instituto Livre Mercado / Frente Parlamentar pelo Livre Mercado
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *'


jobs:
  rss2telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Download artifact
        id: download
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: LivreMercado.yml
          workflow_conclusion: success
      - name: Move database
        continue-on-error: true
        run: mv rss2telegram/rss2telegram.db rss2telegram.db
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install Requirements
        run: pip install -r requirements.txt
      - name: Run Rss to Telegram
        run: python rss2telegram.py
        env:
          BOT_TOKEN: ${{ secrets.JHGouveia_bot_Token }}
          DESTINATION: ${{ vars.DESTINATION_LIVRE_MERCADO }}
          URL: ${{ vars.URL_LIVRE_MERCADO }}
          EMOJIS: ${{ vars.EMOJIS_LIVRE_MERCADO }}
          TOPIC: ${{ vars.TOPIC_LIVRE_MERCADO }}
          HIDE_BUTTON: ${{ vars.HIDE_BUTTON_LIVRE_MERCADO }}
          MESSAGE_TEMPLATE: ${{ vars.MESSAGE_TEMPLATE_LIVRE_MERCADO }}
          BUTTON_TEXT: ${{ vars.BUTTON_TEXT_LIVRE_MERCADO }}
          PARAMETERS: ${{ vars.PARAMETERS_LIVRE_MERCADO }}
          TELEGRAPH_TOKEN: ${{ vars.TELEGRAPH_TOKEN_LIVRE_MERCADO }}
          DRYRUN: ${{ steps.download.outcome }}
      - name: Upload history
        uses: actions/upload-artifact@v4
        with:
          name: rss2telegram
          path: rss2telegram.db
